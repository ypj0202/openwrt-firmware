name: Monthly OpenWrt Firmware Build

on:
  workflow_dispatch:
  schedule:
    # First day of every month at 00:00 UTC
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  detect-version:
    name: Detect latest stable OpenWrt
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.openwrt.outputs.version }}
      tag: ${{ steps.openwrt.outputs.tag }}

    steps:
      - name: Resolve latest stable release
        id: openwrt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASES="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/openwrt/openwrt/releases?per_page=100"
          )"

          VERSION="$(
            printf '%s' "${RELEASES}" |
              python3 -c '
          import json
          import re
          import sys

          releases = json.load(sys.stdin)
          versions = []

          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue

              tag = release.get("tag_name", "")
              match = re.fullmatch(r"v?(\d+\.\d+\.\d+)", tag)

              if match:
                  version = match.group(1)
                  versions.append(tuple(map(int, version.split("."))))

          if not versions:
              raise SystemExit("No stable OpenWrt x.y.z release was found")

          print(".".join(map(str, max(versions))))
          '
          )"

          TAG="v${VERSION}"

          echo "Latest stable OpenWrt version: ${VERSION}"
          echo "OpenWrt source tag: ${TAG}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify source tag exists
        shell: bash
        env:
          OPENWRT_TAG: ${{ steps.openwrt.outputs.tag }}
        run: |
          set -euo pipefail

          git ls-remote \
            --exit-code \
            --refs \
            https://github.com/openwrt/openwrt.git \
            "refs/tags/${OPENWRT_TAG}"

  build:
    name: Build ${{ matrix.device_name }}
    needs: detect-version
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      OPENWRT_VERSION: ${{ needs.detect-version.outputs.version }}
      OPENWRT_TAG: ${{ needs.detect-version.outputs.tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - device_name: Xiaomi Mi Router CR6608
            profile: xiaomi_mi-router-cr6608
            firmware_pattern: xiaomi_mi-router-cr6608
            artifact_name: xiaomi-mi-router-cr6608

          - device_name: Xiaomi Redmi Router AC2100
            profile: xiaomi_redmi-router-ac2100
            firmware_pattern: xiaomi_redmi-router-ac2100
            artifact_name: xiaomi-redmi-router-ac2100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            fastjar \
            flex \
            g++ \
            g++-multilib \
            gawk \
            gcc \
            gcc-multilib \
            gettext \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            npm \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            upx-ucl \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

      - name: Clone OpenWrt source
        shell: bash
        run: |
          set -euo pipefail

          echo "Building OpenWrt ${OPENWRT_VERSION} from ${OPENWRT_TAG}"

          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Update OpenWrt feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a

      - name: Replace Go package feed for NetBird
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          rm -rf feeds/packages/lang/golang

          git clone \
            --depth 1 \
            --branch 26.x \
            https://github.com/sbwml/packages_lang_golang.git \
            feeds/packages/lang/golang

      - name: Add Argon packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p openwrt/package/custom

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            openwrt/package/custom/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            openwrt/package/custom/luci-app-argon-config

          THEME_MAKEFILE="openwrt/package/custom/luci-theme-argon/Makefile"

          if grep -q 'LUCI_DEPENDS:=+wget' "${THEME_MAKEFILE}"; then
            sed -i \
              's/LUCI_DEPENDS:=+wget/LUCI_DEPENDS:=+wget-ssl/' \
              "${THEME_MAKEFILE}"
          fi

          rm -rf \
            openwrt/package/custom/luci-theme-argon/.git \
            openwrt/package/custom/luci-app-argon-config/.git

      - name: Add NetBird package
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/ypj0202/netbird-openwrt-autobuild.git \
            /tmp/netbird-openwrt-autobuild

          test -f /tmp/netbird-openwrt-autobuild/netbird/Makefile

          cp -a \
            /tmp/netbird-openwrt-autobuild/netbird \
            openwrt/package/custom/netbird

          rm -rf \
            openwrt/package/custom/netbird/.git \
            /tmp/netbird-openwrt-autobuild

      - name: Install OpenWrt feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds install -a

      - name: Verify device profile exists
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          PROFILE_SYMBOL="TARGET_ramips_mt7621_DEVICE_${{ matrix.profile }}"

          if ! grep -Rqs \
            "config ${PROFILE_SYMBOL}" \
            target/linux/ramips/image; then
            echo "Device profile not found: ${PROFILE_SYMBOL}"
            exit 1
          fi

      - name: Generate OpenWrt configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_${{ matrix.profile }}=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_netbird=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y

          CONFIG_CCACHE=y
          EOF

          make defconfig

      - name: Verify final configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_OPTIONS=(
            "CONFIG_TARGET_ramips=y"
            "CONFIG_TARGET_ramips_mt7621=y"
            "CONFIG_TARGET_ramips_mt7621_DEVICE_${{ matrix.profile }}=y"
            "CONFIG_PACKAGE_luci-theme-argon=y"
            "CONFIG_PACKAGE_luci-app-argon-config=y"
            "CONFIG_PACKAGE_netbird=y"
          )

          for option in "${REQUIRED_OPTIONS[@]}"; do
            if ! grep -Fqx "${option}" .config; then
              echo "Required configuration option is missing: ${option}"
              exit 1
            fi
          done

          grep -E \
            '^CONFIG_TARGET_ramips_mt7621_DEVICE_.*=y$|^CONFIG_PACKAGE_(luci-theme-argon|luci-app-argon-config|netbird)=y$' \
            .config

      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          make download -j"$(nproc)" V=s

          # Delete suspiciously small/incomplete downloads.
          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          JOBS="$(nproc)"

          if ! make -j"${JOBS}" V=s 2>&1 | tee build.log; then
            echo "Parallel build failed; retrying serially for diagnostics."
            make -j1 V=sc 2>&1 | tee -a build.log
          fi

      - name: Find and verify firmware manifest
        id: manifest
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="bin/targets/ramips/mt7621"

          echo "Generated target files:"
          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          MANIFEST="$(
            find "${TARGET_DIR}" \
              -maxdepth 1 \
              -type f \
              -name "*${{ matrix.firmware_pattern }}*.manifest" \
              -print \
              | head -n 1
          )"

          if [[ -z "${MANIFEST}" ]]; then
            echo "No manifest found for ${{ matrix.device_name }}."
            exit 1
          fi

          REQUIRED_PACKAGES=(
            "luci-theme-argon"
            "luci-app-argon-config"
            "netbird"
          )

          for package in "${REQUIRED_PACKAGES[@]}"; do
            if ! grep -Eq "^${package}[[:space:]]" "${MANIFEST}"; then
              echo "Package missing from firmware manifest: ${package}"
              exit 1
            fi
          done

          echo "manifest=${MANIFEST}" >> "${GITHUB_OUTPUT}"

      - name: Collect firmware files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="openwrt/bin/targets/ramips/mt7621"
          OUTPUT_DIR="out/${{ matrix.artifact_name }}"

          mkdir -p "${OUTPUT_DIR}"

          find "${SOURCE_DIR}" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*${{ matrix.firmware_pattern }}*.bin" -o \
              -name "*${{ matrix.firmware_pattern }}*.itb" -o \
              -name "*${{ matrix.firmware_pattern }}*.manifest" \
            \) \
            -exec cp -v {} "${OUTPUT_DIR}/" \;

          for metadata in \
            config.buildinfo \
            feeds.buildinfo \
            version.buildinfo \
            sha256sums; do
            if [[ -f "${SOURCE_DIR}/${metadata}" ]]; then
              cp -v \
                "${SOURCE_DIR}/${metadata}" \
                "${OUTPUT_DIR}/${{ matrix.artifact_name }}-${metadata}"
            fi
          done

          cp \
            openwrt/.config \
            "${OUTPUT_DIR}/${{ matrix.artifact_name }}-build.config"

          cp \
            openwrt/build.log \
            "${OUTPUT_DIR}/${{ matrix.artifact_name }}-build.log"

          echo "Collected files:"
          find "${OUTPUT_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          if ! find "${OUTPUT_DIR}" \
            -maxdepth 1 \
            -type f \
            \( -name '*.bin' -o -name '*.itb' \) \
            -print \
            -quit |
            grep -q .; then
            echo "No firmware image was collected."
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.artifact_name }}
          path: out/${{ matrix.artifact_name }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish monthly release
    needs:
      - detect-version
      - build
    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ needs.detect-version.outputs.version }}
      OPENWRT_TAG: ${{ needs.detect-version.outputs.tag }}

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: release-assets
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail

          echo "Release files:"
          find release-assets \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          FIRMWARE_COUNT="$(
            find release-assets \
              -maxdepth 1 \
              -type f \
              \( -name '*.bin' -o -name '*.itb' \) \
              | wc -l
          )"

          if [[ "${FIRMWARE_COUNT}" -lt 2 ]]; then
            echo "Expected firmware images for both devices."
            echo "Found ${FIRMWARE_COUNT} image file(s)."
            exit 1
          fi

      - name: Generate release information
        id: release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="monthly-$(date -u +'%Y-%m')"

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

          cat > release-notes.md <<EOF
          Automated OpenWrt ${OPENWRT_VERSION} firmware build.

          OpenWrt source tag:

          - ${OPENWRT_TAG}

          Included custom packages:

          - luci-theme-argon
          - luci-app-argon-config
          - netbird

          Devices:

          - Xiaomi Mi Router CR6608
          - Xiaomi Redmi Router AC2100

          Each device manifest is included so the embedded packages can be verified.
          EOF

      - name: Delete existing release for this month
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete \
              "${RELEASE_TAG}" \
              --yes \
              --cleanup-tag
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpenWrt monthly build ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          files: |
            release-assets/*.bin
            release-assets/*.itb
            release-assets/*.manifest
            release-assets/*.buildinfo
            release-assets/*.config
          fail_on_unmatched_files: false
          generate_release_notes: false
          make_latest: true
