name: Monthly OpenWrt Firmware Build

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even when this OpenWrt version already has a release
        required: false
        default: false
        type: boolean
  schedule:
    # First day of every month at 00:00 UTC
    - cron: "0 0 1 * *"

permissions:
  contents: write

concurrency:
  group: openwrt-stable-firmware-build
  cancel-in-progress: false

jobs:
  detect-version:
    name: Check for a new stable OpenWrt version
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest stable OpenWrt release
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # The OpenWrt download index is the authoritative list of published
          # stable releases. Ignore release candidates and sort numerically.
          VERSION="$({
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              https://downloads.openwrt.org/releases/ \
            | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/' \
            | sed -E 's/^href="//; s:/$::' \
            | sort -V \
            | tail -n 1
          })"

          if [[ -z "${VERSION}" ]]; then
            echo "Could not determine the latest stable OpenWrt version."
            exit 1
          fi

          TAG="v${VERSION}"

          # Confirm that the matching source tag exists before continuing.
          git ls-remote \
            --exit-code \
            --refs \
            https://github.com/openwrt/openwrt.git \
            "refs/tags/${TAG}" >/dev/null

          echo "Latest stable OpenWrt version: ${VERSION}"
          echo "OpenWrt source tag: ${TAG}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check whether this version was already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build || false }}
        run: |
          set -euo pipefail

          if [[ "${FORCE_BUILD}" == "true" ]]; then
            echo "A forced manual build was requested."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. No new OpenWrt version was found."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Release ${RELEASE_TAG} does not exist. A new build is required."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Add job summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHOULD_BUILD: ${{ steps.check.outputs.should_build }}
        run: |
          {
            echo "## OpenWrt version check"
            echo
            echo "- Latest stable version: **${VERSION}**"
            echo "- Release tag: **${TAG}**"
            echo "- Build required: **${SHOULD_BUILD}**"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build ${{ matrix.device_name }}
    needs: detect-version
    if: needs.detect-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      OPENWRT_VERSION: ${{ needs.detect-version.outputs.version }}
      OPENWRT_TAG: ${{ needs.detect-version.outputs.tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - device_name: Xiaomi Mi Router CR6608
            target: ramips
            subtarget: mt7621
            profile: xiaomi_mi-router-cr6608
            firmware_pattern: xiaomi_mi-router-cr6608
            artifact_name: xiaomi-mi-router-cr6608

          - device_name: Xiaomi Redmi Router AC2100
            target: ramips
            subtarget: mt7621
            profile: xiaomi_redmi-router-ac2100
            firmware_pattern: xiaomi_redmi-router-ac2100
            artifact_name: xiaomi-redmi-router-ac2100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            fastjar \
            flex \
            g++ \
            g++-multilib \
            gawk \
            gcc \
            gcc-multilib \
            gettext \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            npm \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            upx-ucl \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

      - name: Clone OpenWrt source
        shell: bash
        run: |
          set -euo pipefail

          echo "Building OpenWrt ${OPENWRT_VERSION} from ${OPENWRT_TAG}"

          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Update OpenWrt feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a

      - name: Replace Go package feed for NetBird
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          rm -rf feeds/packages/lang/golang

          git clone \
            --depth 1 \
            --branch 26.x \
            https://github.com/sbwml/packages_lang_golang.git \
            feeds/packages/lang/golang

      - name: Add Argon packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p openwrt/package/custom

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            openwrt/package/custom/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            openwrt/package/custom/luci-app-argon-config

          THEME_MAKEFILE="openwrt/package/custom/luci-theme-argon/Makefile"

          if grep -q 'LUCI_DEPENDS:=+wget' "${THEME_MAKEFILE}"; then
            sed -i \
              's/LUCI_DEPENDS:=+wget/LUCI_DEPENDS:=+wget-ssl/' \
              "${THEME_MAKEFILE}"
          fi

          rm -rf \
            openwrt/package/custom/luci-theme-argon/.git \
            openwrt/package/custom/luci-app-argon-config/.git

      - name: Add NetBird package
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/ypj0202/netbird-openwrt-autobuild.git \
            /tmp/netbird-openwrt-autobuild

          test -f /tmp/netbird-openwrt-autobuild/netbird/Makefile

          cp -a \
            /tmp/netbird-openwrt-autobuild/netbird \
            openwrt/package/custom/netbird

          rm -rf \
            openwrt/package/custom/netbird/.git \
            /tmp/netbird-openwrt-autobuild

      - name: Install OpenWrt feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds install -a

      - name: Verify device profile exists
        working-directory: openwrt
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          # OpenWrt image Makefiles define profiles as:
          #   define Device/<profile>
          # They do not define them as Kconfig "config TARGET_..." entries.
          if ! grep -RqsE \
            "^[[:space:]]*define[[:space:]]+Device/${PROFILE}[[:space:]]*$" \
            "target/linux/${TARGET}/image"; then
            echo "Device definition not found: Device/${PROFILE}"
            echo "Similar Xiaomi device definitions available in this source tree:"
            grep -RhsE \
              '^[[:space:]]*define[[:space:]]+Device/xiaomi_' \
              "target/linux/${TARGET}/image" \
              | sed -E 's/^[[:space:]]*define[[:space:]]+Device\///' \
              | sort -u \
              || true
            exit 1
          fi

          echo "Found OpenWrt device definition: Device/${PROFILE}"

      - name: Generate OpenWrt configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<EOF
          CONFIG_TARGET_${{ matrix.target }}=y
          CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y
          CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}_DEVICE_${{ matrix.profile }}=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_netbird=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y

          CONFIG_CCACHE=y
          EOF

          make defconfig

      - name: Verify final configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_OPTIONS=(
            "CONFIG_TARGET_${{ matrix.target }}=y"
            "CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y"
            "CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}_DEVICE_${{ matrix.profile }}=y"
            "CONFIG_PACKAGE_luci-theme-argon=y"
            "CONFIG_PACKAGE_luci-app-argon-config=y"
            "CONFIG_PACKAGE_netbird=y"
          )

          for option in "${REQUIRED_OPTIONS[@]}"; do
            if ! grep -Fqx "${option}" .config; then
              echo "Required configuration option is missing after make defconfig: ${option}"
              echo "Selected device options:"
              grep -E '^CONFIG_TARGET_.*_DEVICE_.*=y$' .config || true
              exit 1
            fi
          done

          grep -E \
            '^CONFIG_TARGET_.*_DEVICE_.*=y$|^CONFIG_PACKAGE_(luci-theme-argon|luci-app-argon-config|netbird)=y$' \
            .config

      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          make download -j"$(nproc)" V=s

          # Delete suspiciously small or incomplete downloads.
          find dl -type f -size -1024c -print -delete || true

      - name: Preserve NetBird identity during future upgrades
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p openwrt/files/lib/upgrade/keep.d

          printf '%s\n' '/root/.config/netbird/' \
            > openwrt/files/lib/upgrade/keep.d/netbird

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          JOBS="$(nproc)"

          if ! make -j"${JOBS}" V=s 2>&1 | tee build.log; then
            echo "Parallel build failed; retrying serially for diagnostics."
            make -j1 V=sc 2>&1 | tee -a build.log
          fi

      - name: Find and verify firmware manifest
        id: manifest
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}"

          echo "Generated target files:"
          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          MANIFEST="$({
            find "${TARGET_DIR}" \
              -maxdepth 1 \
              -type f \
              -name "*${{ matrix.firmware_pattern }}*.manifest" \
              -print \
              | head -n 1
          })"

          if [[ -z "${MANIFEST}" ]]; then
            echo "No manifest found for ${{ matrix.device_name }}."
            exit 1
          fi

          REQUIRED_PACKAGES=(
            "luci-theme-argon"
            "luci-app-argon-config"
            "netbird"
          )

          for package in "${REQUIRED_PACKAGES[@]}"; do
            if ! grep -Eq "^${package}[[:space:]]" "${MANIFEST}"; then
              echo "Package missing from firmware manifest: ${package}"
              exit 1
            fi
          done

          echo "manifest=${MANIFEST}" >> "${GITHUB_OUTPUT}"

      - name: Collect firmware files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="openwrt/bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}"
          OUTPUT_DIR="out/${{ matrix.artifact_name }}"

          mkdir -p "${OUTPUT_DIR}"

          find "${SOURCE_DIR}" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*${{ matrix.firmware_pattern }}*.bin" -o \
              -name "*${{ matrix.firmware_pattern }}*.itb" -o \
              -name "*${{ matrix.firmware_pattern }}*.manifest" \
            \) \
            -exec cp -v {} "${OUTPUT_DIR}/" \;

          for metadata in \
            config.buildinfo \
            feeds.buildinfo \
            version.buildinfo \
            sha256sums; do
            if [[ -f "${SOURCE_DIR}/${metadata}" ]]; then
              cp -v \
                "${SOURCE_DIR}/${metadata}" \
                "${OUTPUT_DIR}/${{ matrix.artifact_name }}-${metadata}"
            fi
          done

          cp \
            openwrt/.config \
            "${OUTPUT_DIR}/${{ matrix.artifact_name }}-build.config"

          cp \
            openwrt/build.log \
            "${OUTPUT_DIR}/${{ matrix.artifact_name }}-build.log"

          echo "Collected files:"
          find "${OUTPUT_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          if ! find "${OUTPUT_DIR}" \
            -maxdepth 1 \
            -type f \
            \( -name '*.bin' -o -name '*.itb' \) \
            -print \
            -quit \
            | grep -q .; then
            echo "No firmware image was collected."
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.artifact_name }}
          path: out/${{ matrix.artifact_name }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish OpenWrt ${{ needs.detect-version.outputs.tag }}
    needs:
      - detect-version
      - build
    if: needs.detect-version.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ needs.detect-version.outputs.version }}
      OPENWRT_TAG: ${{ needs.detect-version.outputs.tag }}

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: release-assets
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail

          echo "Release files:"
          find release-assets \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          FIRMWARE_COUNT="$({
            find release-assets \
              -maxdepth 1 \
              -type f \
              \( -name '*.bin' -o -name '*.itb' \) \
              | wc -l
          })"

          if [[ "${FIRMWARE_COUNT}" -lt 2 ]]; then
            echo "Expected firmware images for both devices."
            echo "Found ${FIRMWARE_COUNT} image file(s)."
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.OPENWRT_TAG }}
          name: ${{ env.OPENWRT_TAG }}
          body: ""
          files: |
            release-assets/*.bin
            release-assets/*.itb
            release-assets/*.manifest
            release-assets/*.buildinfo
            release-assets/*.config
          fail_on_unmatched_files: false
          generate_release_notes: false
          make_latest: true
