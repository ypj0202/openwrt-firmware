name: Monthly OpenWrt Firmware Build

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild and replace assets even when today's dated release exists
        required: false
        default: false
        type: boolean
  schedule:
    # First day of every month at 00:00 UTC
    - cron: "0 0 1 * *"

permissions:
  contents: write

concurrency:
  group: openwrt-stable-firmware-build
  cancel-in-progress: false

# CHANGED: Local date used in release names and the LuCI firmware version.
env:
  BUILD_TIMEZONE: Europe/Amsterdam

jobs:
  detect-version:
    name: Resolve stable branch and dated build
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}
      # CHANGED: One source commit and date shared by both device builds.
      branch: ${{ steps.version.outputs.branch }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      firmware_version: ${{ steps.version.outputs.firmware_version }}
      series: ${{ steps.version.outputs.series }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve latest stable OpenWrt release
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # The OpenWrt download index is the authoritative list of published
          # stable releases. Ignore release candidates and sort numerically.
          VERSION="$({
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              https://downloads.openwrt.org/releases/ \
            | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/' \
            | sed -E 's/^href="//; s:/$::' \
            | sort -V \
            | tail -n 1
          })"

          if [[ -z "${VERSION}" ]]; then
            echo "Could not determine the latest stable OpenWrt version."
            exit 1
          fi

          # CHANGED: Separate upstream tag, stable branch, release tag and UI version.
          SOURCE_TAG="v${VERSION}"
          SERIES="${VERSION%.*}"
          BRANCH="openwrt-${SERIES}"
          BUILD_DATE="$(TZ="${BUILD_TIMEZONE}" date +%Y%m%d)"
          TAG="v${VERSION}-build-${BUILD_DATE}"
          FIRMWARE_VERSION="${VERSION} build ${BUILD_DATE}"
          SOURCE_COMMIT="$(git ls-remote --exit-code --heads \
            https://github.com/openwrt/openwrt.git "refs/heads/${BRANCH}" | awk '{print $1}')"
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]

          # Confirm that the matching source tag exists before continuing.
          git ls-remote \
            --exit-code \
            --refs \
            https://github.com/openwrt/openwrt.git \
            "refs/tags/${SOURCE_TAG}" >/dev/null

          echo "Latest stable OpenWrt version: ${VERSION}"
          echo "OpenWrt stable branch: ${BRANCH} (${SOURCE_COMMIT})"
          echo "GitHub release: ${TAG}"
          echo "Firmware version: ${FIRMWARE_VERSION}"
          echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"
