name: Monthly OpenWrt Firmware Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.device_name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_name: Xiaomi Mi Router CR6608
            package_file: xiaomi-mi-router-cr6608.txt
            profile: xiaomi_mi-router-cr6608
          - device_name: Xiaomi Redmi Router AC2100
            package_file: xiaomi-redmi-router-ac2100.txt
            profile: xiaomi_redmi-router-ac2100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 --branch v23.05.5 https://github.com/openwrt/openwrt.git openwrt

      - name: Fetch custom packages
        run: |
          set -eux
          mkdir -p openwrt/package/custom
          git clone --depth 1 https://github.com/ypj0202/netbird-openwrt-autobuild.git openwrt/package/custom/netbird-openwrt-autobuild
          git clone --depth 1 https://github.com/ypj0202/luci-theme-argon-autobuild.git openwrt/package/custom/luci-theme-argon-autobuild

      - name: Build firmware
        run: |
          set -eux
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          PACKAGE_LIST_PATH="$GITHUB_WORKSPACE/openwrt-build/packages/${{ matrix.package_file }}"
          PACKAGE_LIST="$(sed 's#^.*/##' "$PACKAGE_LIST_PATH" | awk 'NF' | sort -u | tr '\n' ' ')"

          cat > .config <<EOCONFIG
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_${{ matrix.profile }}=y
          CONFIG_PACKAGE_netbird-openwrt-autobuild=y
          CONFIG_PACKAGE_luci-theme-argon-autobuild=y
          EOCONFIG

          for pkg in $PACKAGE_LIST; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done

          make defconfig
          make download -j"$(nproc)"
          make -j"$(nproc)" V=s

      - name: Collect firmware files
        run: |
          set -eux
          mkdir -p out/${{ matrix.package_file }}
          find openwrt/bin/targets/ramips/mt7621 -maxdepth 1 -type f \( -name '*.bin' -o -name '*.itb' -o -name '*.manifest' -o -name '*.buildinfo' \) -exec cp {} out/${{ matrix.package_file }}/ \;

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.package_file }}
          path: out/${{ matrix.package_file }}/*
          if-no-files-found: error

  release:
    name: Publish monthly release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release tag
        id: release_tag
        run: echo "tag=monthly-$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: OpenWrt monthly build ${{ steps.release_tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          make_latest: true
